[project]
name = "baay-reseau-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "openai==1.45.0",
    "cloudinary==1.40.0",
    "stripe==10.12.0",
    "sentry-sdk[fastapi]==2.14.0",
    "openpyxl==3.1.5",
    "mangum==0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
